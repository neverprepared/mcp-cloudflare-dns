name: release

# Homebrew + release-asset distribution, replacing the npm publish. Compiles the
# TypeScript MCP server to a single self-contained binary with
# `bun build --compile`, ships it as a GitHub release asset, and renders
# Formula/mcp-cloudflare-dns.rb into neverprepared/homebrew-tap.
#
# The linux assets are not optional extras. The phantom MCP gateway runs in a
# Debian container, where Homebrew cannot reach (every formula in the tap is
# `depends_on :macos`), so the gateway bakes the linux tarball instead. Adapted
# from neverprepared/mcp-kroki, which already distributes this way.

# Triggers: called by release-please.yml once it has created a release, or
# dispatched by hand against a tag to backfill assets.
#
# NOT `push: tags`. release-please creates the tag with the default
# GITHUB_TOKEN, and GitHub deliberately does not fire workflows from events
# raised by that token — so a tag trigger here would silently never run. The
# release would appear, with no binaries attached.
on:
  # The tag is REQUIRED on both paths and is never inferred from the ref.
  # It used to fall back to github.ref_name, which on the workflow_call path is
  # the CALLER's ref - main - so a release-please run published a GitHub release
  # literally named "main" and rewrote the Homebrew formula to version "main",
  # while the real tag got no assets at all.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and attach assets to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach assets to (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # ubuntu, not a pinned macOS image. The macos-14 label stopped being
    # allocatable and failed SILENTLY: the job was created and cancelled one
    # second later having run zero steps, with no error recorded anywhere.
    # Nothing in this job needs macOS — bun cross-compiles all three targets
    # and there is no code signing — so a Linux runner removes that whole class
    # of flakiness.
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Refuse a ref that is not a version tag
        # Cheap insurance against the failure this workflow already caused once:
        # a bad TAG does not error, it publishes a release and a formula under
        # the wrong name while the real release silently gets no assets.
        run: |
          case "$TAG" in
            v[0-9]*) : ;;
            *) echo "refusing to build: TAG=$TAG is not a version tag" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Not --frozen-lockfile: the repo ships package-lock.json (npm is used
        # for dev/tests) and bun migrates it on install, which trips the check.
        run: bun install

      - name: Compile binaries (darwin + linux)
        run: |
          build() { mkdir -p build && bun build --compile --target="$1" ./src/cli.ts --outfile build/mcp-cloudflare-dns && tar -czf "$2" -C build mcp-cloudflare-dns && rm -rf build; }
          build bun-darwin-arm64 mcp-cloudflare-dns_darwin_arm64.tar.gz
          build bun-linux-arm64  mcp-cloudflare-dns_linux_arm64.tar.gz
          build bun-linux-x64    mcp-cloudflare-dns_linux_amd64.tar.gz

      - name: Resolve version + checksum
        id: meta
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum mcp-cloudflare-dns_darwin_arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="mcp-cloudflare-dns_darwin_arm64.tar.gz mcp-cloudflare-dns_linux_arm64.tar.gz mcp-cloudflare-dns_linux_amd64.tar.gz"
          gh release create "${TAG}" $assets \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes || \
          gh release upload "${TAG}" $assets \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Render + push Homebrew formula
        env:
          # Org-level secret: a fine-grained PAT with contents:write on
          # neverprepared/homebrew-tap. Same one mcp-kroki and mcp-slack use.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping formula push (the release assets are already published)."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/neverprepared/homebrew-tap.git" tap
          cat > tap/Formula/mcp-cloudflare-dns.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          # Generated by neverprepared/mcp-cloudflare-dns release workflow. Do not edit by hand.
          class McpCloudflareDns < Formula
            desc "MCP server for Cloudflare DNS - list, create, update, and delete DNS records"
            homepage "https://github.com/neverprepared/mcp-cloudflare-dns"
            version "${VERSION}"
            license "MIT"
            depends_on :macos

            if Hardware::CPU.arm?
              url "https://github.com/neverprepared/mcp-cloudflare-dns/releases/download/v${VERSION}/mcp-cloudflare-dns_darwin_arm64.tar.gz"
              sha256 "${SHA256}"

              define_method(:install) do
                bin.install "mcp-cloudflare-dns"
              end
            end

            def caveats
              <<~EOS
                Requires a Cloudflare API token:
                  CLOUDFLARE_API_TOKEN=... mcp-cloudflare-dns

                Optional:
                  CLOUDFLARE_ZONE_ID   default zone for every tool
                  CLOUDFLARE_EMAIL     only for legacy global-key auth

                Configure your MCP host (e.g. Claude Code) to run:
                  mcp-cloudflare-dns
              EOS
            end
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mcp-cloudflare-dns.rb
          git commit -m "mcp-cloudflare-dns ${VERSION}" || { echo "no formula change"; exit 0; }
          git push

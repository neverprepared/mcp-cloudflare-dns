name: Publish to npm

# DISABLED as an automatic trigger. We no longer publish to npmjs.org — a v*
# tag now builds a self-contained binary, attaches it to the GitHub release and
# renders the Homebrew formula (see release.yaml). Leaving this on `push: tags`
# would race that workflow on the very same tag.
#
# The workflow itself is kept rather than deleted, along with package.json, so
# the npm route stays documented and one dispatch away if it is ever wanted.
# Note it needs an NPM_TOKEN that is currently rejected by the registry.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: npm test

      - run: npm publish --access public --provenance --registry https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
